name: Saudi Benchmark Contract

on:
  push:
    branches: [main, codex/seven-stage-production]
    paths:
      - 'benchmarks/saudi-floorplans/**'
      - 'backend/scripts/validate_saudi_benchmark.py'
      - '.github/workflows/benchmark.yml'
  pull_request:
    paths:
      - 'benchmarks/saudi-floorplans/**'
      - 'backend/scripts/validate_saudi_benchmark.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate licensed Saudi benchmark manifest
        run: python backend/scripts/validate_saudi_benchmark.py
