name: Saudi Benchmark Validation

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'benchmarks/saudi-floorplans/**'
      - 'backend/scripts/validate_saudi_benchmark.py'
      - 'backend/scripts/run_saudi_benchmark.py'
      - 'backend/app/parser.py'
      - 'backend/app/cubicasa_model.py'
      - '.github/workflows/benchmark.yml'
  pull_request:
    paths:
      - 'benchmarks/saudi-floorplans/**'
      - 'backend/scripts/**'
      - 'backend/app/parser.py'
      - 'backend/app/cubicasa_model.py'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

jobs:
  validate-and-measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate rights, de-identification and splits
        run: python backend/scripts/validate_saudi_benchmark.py
      - name: Install real CPU parser stack
        run: pip install -r backend/requirements-ml-cpu.txt
      - name: Fetch and verify Deep Parser weights
        env:
          FLOORPLAN_SAFETENSORS_MODEL: ${{ runner.temp }}/floorplan/best.safetensors
        run: python backend/scripts/fetch_floorplan_model.py
      - name: Execute licensed Saudi benchmark cases
        env:
          FLOORPLAN_SAFETENSORS_MODEL: ${{ runner.temp }}/floorplan/best.safetensors
        run: python backend/scripts/run_saudi_benchmark.py
      - name: Enforce measured-claim policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('benchmark-execution-report.json').read_text(encoding='utf-8'))
          licensed = int(report.get('licensed_cases_in_manifest', 0))
          executed = int(report.get('executed_cases', 0))
          if licensed == 0:
              print('::warning::No licensed Saudi benchmark cases are present. Saudi accuracy claims remain DISABLED.')
              print('claims_enabled=false')
          else:
              assert executed == licensed, report
              print(f'claims_enabled=true; cases={executed}; mean_overall={report.get("mean_overall")}')
          PY
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: saudi-benchmark-reports
          path: |
            benchmark-contract-report.json
            benchmark-execution-report.json
          if-no-files-found: error
