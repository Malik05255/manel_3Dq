name: Saudi Benchmark Contract

on:
  push:
    branches: [main, codex/seven-production-upgrade, codex/eight-production-upgrade]
    paths:
      - 'benchmarks/saudi-floorplans/**'
      - 'backend/scripts/validate_saudi_benchmark.py'
      - 'backend/scripts/run_saudi_benchmark.py'
      - '.github/workflows/benchmark.yml'
  pull_request:
    paths:
      - 'benchmarks/saudi-floorplans/**'
      - 'backend/scripts/validate_saudi_benchmark.py'
      - 'backend/scripts/run_saudi_benchmark.py'
      - '.github/workflows/benchmark.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate licensed Saudi benchmark manifest
        run: python backend/scripts/validate_saudi_benchmark.py
      - name: Measure available licensed benchmark cases
        run: python backend/scripts/run_saudi_benchmark.py
      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: saudi-benchmark-reports
          path: |
            benchmark-contract-report.json
            saudi-benchmark-measurement-report.json
