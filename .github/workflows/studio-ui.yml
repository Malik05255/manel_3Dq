name: Studio UI
on:
  push:
    branches: [ 'codex/architectural-studio-redesign' ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle wrapper --gradle-version 8.7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Arabic screens on a compact phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 480
            adb shell settings put system font_scale 1.15
            ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.manzili.hai/files/studio-screenshots studio-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Studio-native-screens
          path: |
            studio-screenshots
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
