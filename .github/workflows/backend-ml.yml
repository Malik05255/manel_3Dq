name: Backend Reader V2 Validation

on:
  push:
    branches: [ main, 'codex/**', 'feat/**' ]
    paths:
      - 'backend/app/cubicasa_model.py'
      - 'backend/app/parser.py'
      - 'backend/app/parser_v2.py'
      - 'backend/app/parser_accuracy.py'
      - 'backend/app/parser_quality.py'
      - 'backend/app/roboflow_parser.py'
      - 'backend/app/reader_main.py'
      - 'backend/app/wall_support.py'
      - 'backend/tests/test_wall_support.py'
      - 'backend/requirements.txt'
      - 'backend/Dockerfile.reader'
      - 'render.yaml'
      - '.github/workflows/backend-ml.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/app/cubicasa_model.py'
      - 'backend/app/parser.py'
      - 'backend/app/parser_v2.py'
      - 'backend/app/parser_accuracy.py'
      - 'backend/app/parser_quality.py'
      - 'backend/app/roboflow_parser.py'
      - 'backend/app/reader_main.py'
      - 'backend/app/wall_support.py'
      - 'backend/tests/test_wall_support.py'
      - 'backend/requirements.txt'
      - 'backend/Dockerfile.reader'
      - 'render.yaml'
      - '.github/workflows/backend-ml.yml'
  workflow_dispatch:

concurrency:
  group: manzili-hai-reader-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reader:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install reader v2 dependencies
        run: pip install -r requirements.txt pytest==8.4.1
      - name: Import hybrid reader service
        run: |
          python - <<'PY'
          from app.reader_main import app
          assert app.title == 'Manzili HAI Reader V2'
          assert any(getattr(route, 'path', '') == '/v2/parse' for route in app.routes)
          print('reader service import ok')
          PY
      - name: Test wall source-image support gate
        run: pytest -q tests/test_wall_support.py
      - name: Run deterministic parser fallback smoke test
        run: |
          python - <<'PY'
          import base64
          import cv2
          import numpy as np
          from app.parser_v2 import parse_floorplan

          image = np.full((420, 620, 3), 255, dtype=np.uint8)
          cv2.rectangle(image, (70, 60), (550, 350), (0, 0, 0), 8)
          cv2.line(image, (310, 60), (310, 350), (0, 0, 0), 8)
          ok, encoded = cv2.imencode('.png', image)
          assert ok
          payload = base64.b64encode(encoded.tobytes()).decode('ascii')
          result = parse_floorplan(payload)
          assert isinstance(result, dict)
          assert 'walls' in result and 'rooms' in result and 'warnings' in result
          assert str(result.get('model_used', '')).endswith('+wall-support-v1')
          assert 'wall_validation_meta' in result
          print('reader fallback smoke test ok', len(result['walls']), len(result['rooms']))
          PY
