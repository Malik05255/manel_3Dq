name: Backend Reader V3 Validation

on:
  push:
    branches: [ main, 'codex/**', 'feat/**', 'fix/**' ]
    paths:
      - 'backend/app/benchmark_metrics.py'
      - 'backend/app/cubicasa_model.py'
      - 'backend/app/ocr_main.py'
      - 'backend/app/ocr_reader.py'
      - 'backend/app/parser.py'
      - 'backend/app/parser_v2.py'
      - 'backend/app/parser_v3.py'
      - 'backend/app/parser_accuracy.py'
      - 'backend/app/parser_quality.py'
      - 'backend/app/roboflow_parser.py'
      - 'backend/app/reader_main.py'
      - 'backend/app/source_vectorizer.py'
      - 'backend/app/wall_support.py'
      - 'backend/scripts/fetch_floorplan_model.py'
      - 'backend/scripts/install_portable_tesseract.py'
      - 'backend/tests/test_cubicasa_runtime_config.py'
      - 'backend/tests/test_ocr_reader.py'
      - 'backend/tests/test_wall_support.py'
      - 'backend/tests/test_benchmark_metrics.py'
      - 'backend/requirements-reader-v3.txt'
      - 'backend/requirements-ocr-service.txt'
      - 'backend/requirements-ml-cpu.txt'
      - 'backend/Dockerfile.reader'
      - 'render.yaml'
      - '.github/workflows/backend-ml.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/app/benchmark_metrics.py'
      - 'backend/app/cubicasa_model.py'
      - 'backend/app/ocr_main.py'
      - 'backend/app/ocr_reader.py'
      - 'backend/app/parser.py'
      - 'backend/app/parser_v2.py'
      - 'backend/app/parser_v3.py'
      - 'backend/app/parser_accuracy.py'
      - 'backend/app/parser_quality.py'
      - 'backend/app/roboflow_parser.py'
      - 'backend/app/reader_main.py'
      - 'backend/app/source_vectorizer.py'
      - 'backend/app/wall_support.py'
      - 'backend/scripts/fetch_floorplan_model.py'
      - 'backend/scripts/install_portable_tesseract.py'
      - 'backend/tests/test_cubicasa_runtime_config.py'
      - 'backend/tests/test_ocr_reader.py'
      - 'backend/tests/test_wall_support.py'
      - 'backend/tests/test_benchmark_metrics.py'
      - 'backend/requirements-reader-v3.txt'
      - 'backend/requirements-ocr-service.txt'
      - 'backend/requirements-ml-cpu.txt'
      - 'backend/Dockerfile.reader'
      - 'render.yaml'
      - '.github/workflows/backend-ml.yml'
  workflow_dispatch:

concurrency:
  group: manzili-hai-reader-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-reader:
    runs-on: ubuntu-latest
    env:
      FLOORPLAN_LOW_MEMORY: "true"
      FLOORPLAN_IMAGE_SIZE: "352"
      FLOORPLAN_DTYPE: "float32"
      FLOORPLAN_TORCH_THREADS: "1"
      FLOORPLAN_TILED_INFERENCE: "true"
      FLOORPLAN_TILE_OVERLAP: "0.30"
      FLOORPLAN_MAX_TILES: "12"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements-reader-v3.txt
            backend/requirements-ocr-service.txt

      - name: Install production Reader and OCR dependencies
        run: pip install -r requirements-reader-v3.txt -r requirements-ocr-service.txt pytest==8.4.1

      - name: Install and verify portable Arabic English Tesseract
        run: python scripts/install_portable_tesseract.py

      - name: Verify isolated OCR service and languages
        env:
          OCR_PROVIDER_URL: ""
          TESSERACT_LANG: ara+eng
          TESSERACT_CONFIG: "--psm 11"
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from app.ocr_main import app as ocr_app
          from app.ocr_reader import cloud_ocr_engine_name, cloud_ocr_reader

          cloud_ocr_reader.cache_clear()
          assert ocr_app.title == 'Manzili HAI Arabic OCR'
          assert any(getattr(route, 'path', '') == '/v1/ocr' for route in ocr_app.routes)
          assert any(getattr(route, 'path', '') == '/readyz' for route in ocr_app.routes)
          assert cloud_ocr_engine_name() == 'tesseract-ara-eng'
          reader = cloud_ocr_reader()
          assert reader is not None

          image = np.full((220, 720, 3), 255, dtype=np.uint8)
          cv2.putText(image, 'ROOM 3.50', (30, 135), cv2.FONT_HERSHEY_SIMPLEX, 2.1, (0, 0, 0), 5, cv2.LINE_AA)
          result = reader.readtext(image, detail=1, paragraph=False)
          joined = ' '.join(str(item[1]) for item in result if len(item) >= 2)
          assert '3.50' in joined or '3.5' in joined, joined
          print('Portable OCR ok; engine=tesseract-ara-eng; sample=', joined)
          PY

      - name: Test remote OCR adapter contract
        run: PYTHONPATH=. pytest -q tests/test_ocr_reader.py

      - name: Fetch and verify locked CubiCasa weights
        env:
          FLOORPLAN_SAFETENSORS_MODEL: ${{ runner.temp }}/floorplan/best.safetensors
        run: python scripts/fetch_floorplan_model.py

      - name: Load CubiCasa model and stay below Render 512 MB during tiled inference
        env:
          FLOORPLAN_SAFETENSORS_MODEL: ${{ runner.temp }}/floorplan/best.safetensors
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          import resource
          from app.cubicasa_model import CLASS_NAMES, load_cubicasa_runtime, model_status

          render_limit_kib = 512 * 1024
          runtime = load_cubicasa_runtime()
          assert runtime is not None, model_status()
          loaded = model_status()
          assert loaded.get('image_size') == 352, loaded
          assert loaded.get('dtype') == 'float32', loaded
          assert loaded.get('low_memory') is True, loaded
          assert loaded.get('torch_threads') == 1, loaded
          assert isinstance(loaded.get('rss_kib'), int), loaded
          assert loaded['rss_kib'] < render_limit_kib, loaded

          image = np.full((1400, 1800, 3), 255, dtype=np.uint8)
          cv2.rectangle(image, (100, 100), (1700, 1300), (0, 0, 0), 16)
          cv2.line(image, (900, 100), (900, 1300), (0, 0, 0), 12)
          prediction = runtime.predict(image)
          assert prediction.shape == image.shape[:2]
          assert int(prediction.min()) >= 0
          assert int(prediction.max()) < len(CLASS_NAMES)

          after = model_status()
          assert isinstance(after.get('rss_kib'), int), after
          assert after['rss_kib'] < render_limit_kib, after
          peak_kib = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          print('CubiCasa FP32 tiled low-memory inference ok', prediction.shape, 'current_rss_kib=', after['rss_kib'], 'historical_peak_kib=', peak_kib, after)
          PY

      - name: Verify Reader V3 service uses remote OCR contract
        env:
          FLOORPLAN_SAFETENSORS_MODEL: ${{ runner.temp }}/floorplan/best.safetensors
          OCR_PROVIDER_URL: https://ocr.invalid
          OCR_PROVIDER_TOKEN: ci-token
        run: |
          python - <<'PY'
          from app.ocr_reader import cloud_ocr_engine_name, cloud_ocr_reader
          from app.reader_main import app
          from app.cubicasa_model import load_cubicasa_runtime, model_status

          cloud_ocr_reader.cache_clear()
          assert app.title == 'Manzili HAI Reader V3'
          assert app.version == '3.0.0'
          assert any(getattr(route, 'path', '') == '/v2/parse' for route in app.routes)
          assert any(getattr(route, 'path', '') == '/readyz' for route in app.routes)
          assert cloud_ocr_engine_name() == 'remote-tesseract-ara-eng'
          assert load_cubicasa_runtime() is not None
          status = model_status()
          assert status['image_size'] == 352
          assert status['dtype'] == 'float32'
          print('Reader V3 service contract ok; CubiCasa low-memory + remote Arabic OCR')
          PY

      - name: Test low-memory config, geometry and benchmark scoring gates
        run: PYTHONPATH=. pytest -q tests/test_cubicasa_runtime_config.py tests/test_wall_support.py tests/test_benchmark_metrics.py

      - name: Run deterministic Reader V3 geometry smoke test
        run: |
          python - <<'PY'
          import cv2
          import numpy as np
          from app.parser_v3 import _axis_centerlines

          mask = np.zeros((600, 800), dtype=np.uint8)
          cv2.line(mask, (80, 100), (720, 100), 255, 14)
          cv2.line(mask, (80, 500), (720, 500), 255, 14)
          cv2.line(mask, (80, 100), (80, 500), 255, 14)
          cv2.line(mask, (720, 100), (720, 500), 255, 14)
          cv2.line(mask, (400, 100), (400, 500), 255, 14)

          walls = _axis_centerlines(mask)
          assert len(walls) >= 4, walls
          assert all('start' in wall and 'end' in wall for wall in walls)
          assert all(str(wall.get('kind', '')).startswith('cubicasa-') for wall in walls)
          print('Reader V3 geometry smoke ok; walls=', len(walls))
          PY
