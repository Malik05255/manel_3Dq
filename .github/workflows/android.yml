name: Android Build

on:
  push:
    branches: [ main, 'codex/**', 'android-light-rebuild' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: manzili-hai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce Android-only product
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle.kts
          if find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Podfile' -o -name 'Package.swift' \) -print -quit | grep -q .; then
            echo 'iOS build surface detected; Manzili HAI is Android-only.' >&2
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Verify focused production surface
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=app/src/main/AndroidManifest.xml
          LAUNCHER=app/src/main/java/com/manzili/hai/FocusedMainActivityV2.kt
          IMPORT_SCREEN=app/src/main/java/com/manzili/hai/Hai360ImportScreen.kt
          PLAN_STORE=app/src/main/java/com/manzili/hai/data/ProjectPlanStore.kt
          SOURCE_STORE=app/src/main/java/com/manzili/hai/data/ProjectSourceStore.kt
          GLTF=app/src/main/java/com/manzili/hai/export/GltfPlanExporter.kt
          REMOTE_PARSER=app/src/main/java/com/manzili/hai/engine/RemoteFloorplanEvidenceClient.kt

          grep -q 'android:name=".FocusedMainActivityV2"' "$MANIFEST"
          ! grep -q 'composable("4d")' "$LAUNCHER"

          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'versionName = "0.63.0"' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"

          grep -q 'EncryptedSharedPreferences.create' "$PLAN_STORE"
          grep -q 'manzili_hai_project_secure_v1' "$PLAN_STORE"
          grep -q 'EncryptedSharedPreferences.create' "$SOURCE_STORE"
          grep -q 'manzili_hai_project_sources_secure_v1' "$SOURCE_STORE"

          grep -q 'BuildConfig.VERSION_NAME' "$GLTF"
          grep -q 'android-reader-v2' "$REMOTE_PARSER"
          grep -q 'hai-floorplan-gateway' "$REMOTE_PARSER"
          grep -q 'candidateBaseUrls' "$REMOTE_PARSER"
          grep -q 'RemoteFloorplanEvidenceClient' "$IMPORT_SCREEN"
          ! grep -q 'AdaptivePlanOcrEngine' "$IMPORT_SCREEN"
          ! grep -q 'RasterFloorplanParserEngine' "$IMPORT_SCREEN"
          ! grep -q 'MultiPageHaiPlanAnalyzer' "$IMPORT_SCREEN"
          ! grep -q 'com.google.mlkit:text-recognition' app/build.gradle.kts
      - name: Run engine regression tests
        run: ./gradlew testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew lintDebug
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build optimized release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: Manzili-HAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: Manzili-HAI-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Manzili-HAI-quality-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
