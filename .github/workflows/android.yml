name: Android Build

on:
  push:
    branches: [ main, 'codex/**' ]
  workflow_dispatch:

concurrency:
  group: manzili-hai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Run engine regression tests
        id: regression
        continue-on-error: true
        run: ./gradlew testDebugUnitTest
      - name: Print failed regression details
        if: steps.regression.outcome == 'failure'
        run: |
          echo '--- Failed tests ---'
          find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -type f -print0 2>/dev/null \
            | xargs -0 grep -H -n -E '<failure|<error' || true
          echo '--- Failure context ---'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('app/build/test-results/testDebugUnitTest')
          for p in root.glob('TEST-*.xml'):
              try:
                  suite = ET.parse(p).getroot()
              except Exception:
                  continue
              for case in suite.findall('testcase'):
                  bad = case.find('failure') or case.find('error')
                  if bad is not None:
                      print(f"FAILED {case.get('classname')}.{case.get('name')}")
                      print((bad.get('message') or '').strip())
                      print((bad.text or '').strip()[:3000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manzili-HAI-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
      - name: Stop on regression failure
        if: steps.regression.outcome == 'failure'
        run: exit 1
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build optimized release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Manzili-HAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Manzili-HAI-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
