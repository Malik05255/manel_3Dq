name: Android Build

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: manzili-hai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Verify focused production surface
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=app/src/main/AndroidManifest.xml
          LAUNCHER=app/src/main/java/com/manzili/hai/FocusedMainActivityV2.kt
          PLAN_STORE=app/src/main/java/com/manzili/hai/data/ProjectPlanStore.kt
          SOURCE_STORE=app/src/main/java/com/manzili/hai/data/ProjectSourceStore.kt
          GLTF=app/src/main/java/com/manzili/hai/export/GltfPlanExporter.kt

          grep -q 'android:name=".FocusedMainActivityV2"' "$MANIFEST"
          ! grep -q 'composable("4d")' "$LAUNCHER"

          grep -q 'versionCode = 62' app/build.gradle.kts
          grep -q 'versionName = "0.62.0"' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"

          grep -q 'EncryptedSharedPreferences.create' "$PLAN_STORE"
          grep -q 'manzili_hai_project_secure_v1' "$PLAN_STORE"
          grep -q 'EncryptedSharedPreferences.create' "$SOURCE_STORE"
          grep -q 'manzili_hai_project_sources_secure_v1' "$SOURCE_STORE"

          grep -q 'BuildConfig.VERSION_NAME' "$GLTF"
          grep -q 'android-0.62' app/src/main/java/com/manzili/hai/engine/RemoteFloorplanEvidenceClient.kt
      - name: Run engine regression tests
        run: ./gradlew testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew lintDebug
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build optimized release APK and AAB
        run: ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Manzili-HAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Manzili-HAI-release-unsigned
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manzili-HAI-quality-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
