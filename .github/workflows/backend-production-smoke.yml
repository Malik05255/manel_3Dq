name: Backend Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manzili-hai-production-reader-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.MANZILI_PROD_BACKEND_URL || 'https://manzili-hai-deep-parser.onrender.com' }}
      READER_URL: https://manzili-hai-reader-v3-final.onrender.com
      OCR_URL: https://manzili-hai-ocr-ar-en-v2.onrender.com
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect whether production code changed
        shell: bash
        run: |
          set -euo pipefail
          BEFORE='${{ github.event.before }}'
          if [[ -n "$BEFORE" && "$BEFORE" != '0000000000000000000000000000000000000000' ]]; then
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BEFORE"
            git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/changed-files.txt
          else
            git show --pretty='' --name-only "$GITHUB_SHA" > /tmp/changed-files.txt
          fi
          cat /tmp/changed-files.txt
          if grep -Eq '^(backend/|render\.yaml$)' /tmp/changed-files.txt; then
            echo 'DEPLOY_CODE_CHANGED=true' >> "$GITHUB_ENV"
          else
            echo 'DEPLOY_CODE_CHANGED=false' >> "$GITHUB_ENV"
          fi

      - name: Wait for Source-First Reader V4 and Arabic OCR production deployment
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 45); do
            HEALTH="$(curl --silent --show-error --max-time 30 "${BACKEND_URL%/}/health" || true)"
            READER="$(curl --silent --show-error --max-time 30 "${READER_URL%/}/readyz" || true)"
            OCR="$(curl --silent --show-error --max-time 30 "${OCR_URL%/}/readyz" || true)"
            echo "attempt=$attempt health=$HEALTH"
            echo "attempt=$attempt reader=$READER"
            echo "attempt=$attempt ocr=$OCR"
            if python - "$HEALTH" "$READER" "$OCR" "$GITHUB_SHA" "$DEPLOY_CODE_CHANGED" <<'PY'
          import json
          import sys

          try:
              health = json.loads(sys.argv[1])
              reader = json.loads(sys.argv[2])
              ocr = json.loads(sys.argv[3])
          except Exception:
              raise SystemExit(1)
          expected_sha = sys.argv[4]
          deploy_code_changed = sys.argv[5].lower() == "true"
          assert health.get("version") == "0.73.0", health
          assert health.get("reader") == "hai-source-first-v4", health
          assert health.get("reader_provider_configured") is True, health
          assert health.get("modal_fallback_configured") is False, health
          assert health.get("source_first_required") is True, health
          assert health.get("local_inference") is False, health
          deployed = health.get("git_commit")
          if deploy_code_changed:
              assert deployed == expected_sha, (deployed, expected_sha)
          assert reader.get("ready") is True, reader
          assert reader.get("reader") == "hai-source-first-v4", reader
          assert reader.get("local_segmentation_configured") is True, reader
          assert reader.get("version") == "4.0.0", reader
          assert reader.get("ocr") == "remote-tesseract-ara-eng", reader
          assert ocr.get("ready") is True, ocr
          assert ocr.get("engine") == "tesseract-ara-eng", ocr
          assert set(ocr.get("languages") or []) >= {"ara", "eng"}, ocr
          PY
            then
              success=1
              break
            fi
            sleep 20
          done
          test "$success" -eq 1 || { echo 'Source-First Reader V4 / Arabic OCR production deployment did not become ready' >&2; exit 1; }

      - name: Verify public gateway requires Source-First Reader V4
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 45 \
            -H 'X-Manzili-Parser-Client: android-source-first-v4' \
            "${BACKEND_URL%/}/v1/public/parser/status")"
          echo "parser-status=$BODY"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ready") is True, d; assert d.get("reader")=="hai-source-first-v4", d; assert d.get("preferred_path")=="hai-source-first-v4", d; assert d.get("reader_configured") is True, d; assert d.get("source_first_required") is True, d; assert d.get("modal_reader_configured") is False, d; assert d.get("local_inference") is False, d' "$BODY"

      - name: Run end-to-end Source-First V4 parse through production gateway and remote OCR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import struct
          import zlib

          w = h = 128
          rows = []
          for y in range(h):
              row = bytearray()
              for x in range(w):
                  wall = x in range(18, 24) or x in range(104, 110) or y in range(18, 24) or y in range(104, 110) or x in range(61, 67)
                  value = 0 if wall else 255
                  row.extend((value, value, value))
              rows.append(b'\x00' + bytes(row))

          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)

          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
          png += chunk(b'IEND', b'')
          payload = {"image_base64": base64.b64encode(png).decode('ascii'), "page_index": 0}
          with open('reader-smoke-payload.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, separators=(',', ':'))
          PY

          BODY="$(curl --fail --silent --show-error --max-time 330 \
            -H 'X-Manzili-Parser-Client: android-source-first-v4' \
            -H 'Content-Type: application/json' \
            --data-binary @reader-smoke-payload.json \
            "${BACKEND_URL%/}/v1/public/parse-floorplan")"
          echo "parse-response=${BODY:0:1600}"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("model_used")=="hai-source-first-v4+cubicasa-openings+ocr", d; assert d.get("reader_path")=="hai-source-first-v4", d; assert d.get("local_inference") is False, d; assert isinstance(d.get("walls"), list), d; assert isinstance(d.get("rooms"), list), d; assert isinstance(d.get("openings"), list), d; assert isinstance(d.get("geometry_recovery"), dict), d; assert isinstance(d.get("quality"), dict), d; assert (d.get("ocr_meta") or {}).get("engine")=="remote-tesseract-ara-eng", d' "$BODY"
