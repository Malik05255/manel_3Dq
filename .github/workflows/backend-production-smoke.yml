name: Backend Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.MANZILI_PROD_BACKEND_URL }}
      BACKEND_TOKEN: ${{ secrets.MANZILI_PROD_API_TOKEN }}
    steps:
      - name: Require production endpoint secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_URL" || (echo 'MANZILI_PROD_BACKEND_URL is missing' >&2; exit 1)
          test -n "$BACKEND_TOKEN" || (echo 'MANZILI_PROD_API_TOKEN is missing' >&2; exit 1)

      - name: Verify public readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 45 "${BACKEND_URL%/}/readyz")"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True and d.get("deep_parser_ready") is True, d; print("readyz ok", d.get("version"))' "$BODY"

      - name: Verify authenticated parser readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 45 -H "Authorization: Bearer $BACKEND_TOKEN" "${BACKEND_URL%/}/v1/parser/status")"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ready") is True, d; assert d.get("preferred_path") == "cubicasa-unet-resnet34", d; print("parser status ok")' "$BODY"
