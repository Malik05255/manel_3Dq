name: Backend Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [ 'codex/**' ]
    paths:
      - '.github/workflows/backend-production-smoke.yml'
      - 'render.yaml'
  workflow_run:
    workflows: [ 'Backend Build' ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.MANZILI_PROD_BACKEND_URL || 'https://manzili-hai-deep-parser.onrender.com' }}
      BACKEND_TOKEN: ${{ secrets.MANZILI_PROD_API_TOKEN }}
      CONFIG_ATTEMPTS: ${{ github.event_name == 'workflow_run' && '30' || '1' }}
    steps:
      - name: Validate production endpoint
        shell: bash
        run: |
          set -euo pipefail
          case "$BACKEND_URL" in
            https://*) ;;
            *) echo 'Production backend must use HTTPS' >&2; exit 1 ;;
          esac

      - name: Wait for core production readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$CONFIG_ATTEMPTS"); do
            if BODY="$(curl --fail --silent --show-error --max-time 45 "${BACKEND_URL%/}/health" 2>/dev/null)"; then
              echo "health=$BODY"
              if python -c 'import json,sys; d=json.loads(sys.argv[1]); required=("service_auth_configured","supabase_configured","deep_parser_ready"); missing=[k for k in required if d.get(k) is not True]; assert d.get("version")=="0.62.0", d; assert not missing, f"core production services not configured: {missing}; health={d}"' "$BODY"; then
                if ! python -c 'import json,sys; d=json.loads(sys.argv[1]); raise SystemExit(0 if d.get("ai_configured") is True else 1)' "$BODY"; then
                  echo '::warning::Server AI provider is not configured; HAI/vision is degraded while Deep Parser remains available.'
                fi
                echo "core production readiness ok"
                exit 0
              fi
            fi
            if [ "$attempt" -lt "$CONFIG_ATTEMPTS" ]; then
              echo "production not ready yet (attempt $attempt/$CONFIG_ATTEMPTS)"
              sleep 20
            fi
          done
          echo 'Core production configuration is incomplete or unavailable' >&2
          exit 1

      - name: Verify public readiness
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 45 "${BACKEND_URL%/}/readyz")"
          echo "readyz=$BODY"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True and d.get("deep_parser_ready") is True, d; assert d.get("version")=="0.62.0", d; print("readyz ok", d.get("version"))' "$BODY"

      - name: Verify authenticated parser readiness when test credential is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BACKEND_TOKEN" ]; then
            echo '::warning::MANZILI_PROD_API_TOKEN is missing from GitHub Actions secrets; authenticated parser smoke coverage is skipped.'
            exit 0
          fi
          BODY="$(curl --fail --silent --show-error --max-time 45 -H "Authorization: Bearer $BACKEND_TOKEN" "${BACKEND_URL%/}/v1/parser/status")"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ready") is True, d; assert d.get("preferred_path") == "cubicasa-unet-resnet34", d; print("parser status ok")' "$BODY"
