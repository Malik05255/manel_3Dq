name: Backend Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.MANZILI_PROD_BACKEND_URL || 'https://manzili-hai-deep-parser.onrender.com' }}
      BACKEND_TOKEN: ${{ secrets.MANZILI_PROD_API_TOKEN }}
    steps:
      - name: Validate cloud-only production gateway
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 45 "${BACKEND_URL%/}/health")"
          echo "health=$HEALTH"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("version")=="0.70.0", d; assert d.get("reader")=="modal-raster2seq-cloud-only", d; assert d.get("local_inference") is False, d' "$HEALTH"

      - name: Verify Modal reader readiness
        shell: bash
        run: |
          set -euo pipefail
          READY="$(curl --fail --silent --show-error --max-time 45 "${BACKEND_URL%/}/readyz")"
          echo "readyz=$READY"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ok") is True, d; assert d.get("modal_reader_configured") is True, d; assert d.get("local_inference") is False, d' "$READY"

      - name: Verify authenticated cloud parser status
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_TOKEN" || { echo 'MANZILI_PROD_API_TOKEN is required for this manual smoke test' >&2; exit 1; }
          BODY="$(curl --fail --silent --show-error --max-time 45 -H "Authorization: Bearer $BACKEND_TOKEN" "${BACKEND_URL%/}/v1/parser/status")"
          echo "parser-status=$BODY"
          python -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("ready") is True, d; assert d.get("preferred_path")=="modal-raster2seq-cloud-only", d; assert d.get("local_inference") is False, d' "$BODY"
