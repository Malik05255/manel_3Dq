name: Android Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: manzili-hai-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Require signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KSA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS" || (echo 'ANDROID_KEYSTORE_BASE64 is missing' && exit 2)
          test -n "$KSP" || (echo 'ANDROID_KEYSTORE_PASSWORD is missing' && exit 2)
          test -n "$KSA" || (echo 'ANDROID_KEY_ALIAS is missing' && exit 2)
          test -n "$KP" || (echo 'ANDROID_KEY_PASSWORD is missing' && exit 2)
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/manzili-release.jks"
      - name: Run tests
        run: ./gradlew testDebugUnitTest
      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/manzili-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Verify signed APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
      - name: Verify AAB signature
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -n 1)
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Manzili-HAI-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
