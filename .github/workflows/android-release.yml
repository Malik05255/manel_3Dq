name: Android Production Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: manzili-hai-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Require production signing identity
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Materialize and validate keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/manzili-hai-production.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Run regression tests
        run: ./gradlew testDebugUnitTest
      - name: Build signed release APK and AAB
        run: ./gradlew clean assembleRelease bundleRelease

      - name: Verify official APK certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          VERIFY="$($APKSIGNER verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY"
          ACTUAL="$(printf '%s\n' "$VERIFY" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "$ANDROID_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Signing certificate does not match the pinned official fingerprint." >&2
            exit 1
          fi
          echo "ANDROID_CERT_ACTUAL=$ACTUAL" >> "$GITHUB_ENV"

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$AAB"
          jarsigner -verify -strict "$AAB"

      - name: Create release provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, pathlib
          text=pathlib.Path('app/build.gradle.kts').read_text()
          def pick(pattern):
              m=re.search(pattern,text);return m.group(1) if m else None
          payload={
            'applicationId': pick(r'applicationId\s*=\s*"([^"]+)"'),
            'versionCode': int(pick(r'versionCode\s*=\s*(\d+)') or 0),
            'versionName': pick(r'versionName\s*=\s*"([^"]+)"'),
            'gitSha': os.environ.get('GITHUB_SHA'),
            'certificateSha256': os.environ.get('ANDROID_CERT_ACTUAL'),
            'verified': True
          }
          pathlib.Path('release-provenance.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY

      - name: Upload signed production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Manzili-HAI-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            release-provenance.json
          if-no-files-found: error
          retention-days: 30
