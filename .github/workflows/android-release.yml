name: Android Production Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

concurrency:
  group: manzili-hai-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Enforce Android-only release
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          if find . -maxdepth 4 \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Podfile' -o -name 'Package.swift' \) -print -quit | grep -q .; then
            echo 'iOS release surface detected; Manzili HAI is Android-only.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version and signing mode
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"

          SIGNING_READY=true
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              SIGNING_READY=false
            fi
          done

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "SIGNING_READY=$SIGNING_READY" >> "$GITHUB_ENV"

          if [ "$SIGNING_READY" = true ]; then
            echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=Manzili HAI $VERSION_NAME" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v${VERSION_NAME}-test.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "RELEASE_TITLE=Manzili HAI $VERSION_NAME - Test Build" >> "$GITHUB_ENV"
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            echo 'Production signing secrets are unavailable; publishing an installable debug-signed test APK instead.'
          fi

      - name: Materialize and validate production keystore
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/manzili-hai-production.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Run regression tests
        run: ./gradlew testDebugUnitTest

      - name: Build production APK and AAB
        if: env.SIGNING_READY == 'true'
        run: ./gradlew clean assembleRelease bundleRelease

      - name: Build installable test APK
        if: env.SIGNING_READY != 'true'
        run: ./gradlew clean assembleDebug

      - name: Verify production APK signing certificate
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Verify production AAB signature
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$AAB"
          jarsigner -verify "$AAB"

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$SIGNING_READY" = true ]; then
            APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
            AAB="$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
            test -n "$APK"
            test -n "$AAB"
            cp "$APK" "dist/Manzili-HAI-${VERSION_NAME}.apk"
            cp "$AAB" "dist/Manzili-HAI-${VERSION_NAME}.aab"
          else
            APK="$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
            test -n "$APK"
            cp "$APK" "dist/Manzili-HAI-${VERSION_NAME}-test.apk"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.SIGNING_READY == 'true' && 'Manzili-HAI-release-signed' || 'Manzili-HAI-test-apk' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$SIGNING_READY" = true ]; then
            NOTES="إصدار Manzili HAI ${VERSION_NAME}. APK/AAB موقّعان بهوية الإنتاج."
            EXTRA_FLAGS=()
          else
            NOTES="نسخة اختبار Manzili HAI ${VERSION_NAME}. تم نشر APK قابل للتثبيت لأن مفاتيح توقيع الإنتاج غير موجودة في GitHub Secrets. قد لا تُثبت هذه النسخة فوق نسخة موقعة بمفتاح مختلف؛ عند إضافة مفتاح الإنتاج سيُنشر الإصدار الرسمي بنفس هوية التوقيع."
            EXTRA_FLAGS=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              "${EXTRA_FLAGS[@]}"
          fi
