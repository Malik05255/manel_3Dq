name: Backend Build

on:
  push:
    branches: [ main, codex/seven-stage-production, codex/three-priority-production ]
    paths:
      - 'backend/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend core
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app backend/scripts
      - name: Import FastAPI application
        working-directory: backend
        run: |
          python -c "from app.main import app; assert app.title == 'Manzili HAI Backend'; assert app.version == '0.44.0'"
      - name: Validate deployment blueprint
        run: |
          grep -q 'healthCheckPath: /readyz' render.yaml
          grep -q 'FLOORPLAN_SAFETENSORS_MODEL' render.yaml
          grep -q 'dockerfilePath: ./backend/Dockerfile.ml' render.yaml
