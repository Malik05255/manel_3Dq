name: Backend Build

on:
  push:
    branches: [ main, 'codex/**', 'android-light-rebuild' ]
    paths:
      - 'backend/**'
      - 'modal_reader/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: manzili-hai-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud gateway dependencies
        run: pip install -r backend/requirements-gateway.txt
      - name: Compile cloud surfaces
        run: python -m compileall backend/app/cloud_gateway.py backend/app/cloud_public_gateway.py modal_reader
      - name: Run cloud metric evidence regressions
        run: python -m unittest modal_reader.tests.test_metric_evidence
      - name: Import cloud gateway
        working-directory: backend
        run: |
          python -c "from app.cloud_public_gateway import app; assert app.title == 'Manzili HAI Cloud Gateway'; assert app.version == '0.70.0'; assert any(getattr(r, 'path', '') == '/v1/public/parse-floorplan' for r in app.routes)"
      - name: Validate cloud-only deployment blueprint
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pip install -r backend/requirements-gateway.txt' render.yaml
          grep -q 'uvicorn app.cloud_public_gateway:app' render.yaml
          grep -q 'MODAL_READER_URL' render.yaml
          grep -q 'MODAL_READER_TOKEN' render.yaml
          ! grep -q 'requirements-ml-cpu.txt' render.yaml
          ! grep -q 'fetch_floorplan_model.py' render.yaml
          ! grep -q 'FLOORPLAN_SAFETENSORS_MODEL' render.yaml
          ! grep -q 'ROBOFLOW_' render.yaml
      - name: Verify cloud reader production contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'local_inference.*False' backend/app/cloud_gateway.py
          grep -q 'local_inference.*False' backend/app/cloud_public_gateway.py
          grep -q 'android-cloud-only-v1' backend/app/cloud_public_gateway.py
          grep -q 'raster2graph-512' modal_reader/app.py
          grep -q 'cubicasa5k' modal_reader/app.py
          grep -q '_CC5K_OPENING_LABELS' modal_reader/app.py
          grep -q 'metric_evidence' modal_reader/app.py
          grep -q 'requires_proxy_auth=True' modal_reader/app.py
          grep -q 'verified_for_3d' modal_reader/metric_evidence.py
