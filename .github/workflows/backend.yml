name: Backend Build

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend core
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall backend/app
      - name: Import FastAPI application
        working-directory: backend
        run: python -c "from app.main import app; assert app.title == 'Manzili HAI Backend'"
