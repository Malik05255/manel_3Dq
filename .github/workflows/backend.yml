name: Backend Build

on:
  push:
    branches: [ main, 'codex/**', 'android-light-rebuild', 'feat/**', 'fix/**' ]
    paths:
      - 'backend/**'
      - 'modal_reader/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'modal_reader/**'
      - 'render.yaml'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: manzili-hai-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cloud gateway dependencies
        run: pip install -r backend/requirements-gateway.txt pytest==8.4.1

      - name: Compile cloud, Reader V3 and OCR surfaces
        run: |
          python -m compileall \
            backend/app/cloud_gateway.py \
            backend/app/cloud_public_gateway.py \
            backend/app/reader_provider.py \
            backend/app/reader_main.py \
            backend/app/ocr_main.py \
            backend/app/ocr_reader.py \
            backend/app/parser_v3.py \
            backend/app/benchmark_metrics.py \
            backend/scripts/fetch_floorplan_model.py \
            backend/scripts/install_portable_tesseract.py \
            backend/scripts/ingest_reader_learning_bundle.py \
            modal_reader

      - name: Run provider and gateway routing tests
        run: |
          PYTHONPATH=backend pytest -q \
            backend/tests/test_reader_provider.py \
            backend/tests/test_gateway_reader_priority.py

      - name: Run benchmark metric regressions
        run: PYTHONPATH=backend pytest -q backend/tests/test_benchmark_metrics.py

      - name: Run consented learning bundle intake regressions
        run: PYTHONPATH=backend pytest -q backend/tests/test_reader_learning_bundle.py

      - name: Run cloud metric evidence regressions
        run: python -m unittest modal_reader.tests.test_metric_evidence

      - name: Import cloud gateway
        env:
          READER_PROVIDER_URL: https://manzili-hai-reader-v3-final.onrender.com
          READER_PROVIDER_NAME: hai-reader-v3
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.cloud_public_gateway import app
          from app.cloud_gateway import _reader_state

          assert app.title == 'Manzili HAI Cloud Gateway'
          assert app.version == '0.73.0'
          assert any(getattr(r, 'path', '') == '/v1/public/parse-floorplan' for r in app.routes)
          assert any(getattr(r, 'path', '') == '/v1/internal/legacy-floorplan-evidence' for r in app.routes)
          state = _reader_state()
          assert state['provider_ready'] is True, state
          assert state['preferred'] == 'hai-reader-v3', state
          print('gateway prefers Reader V3', state)
          PY

      - name: Validate Reader V3 and Arabic OCR deployment blueprint
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pip install -r backend/requirements-gateway.txt' render.yaml
          grep -q 'uvicorn app.cloud_public_gateway:app' render.yaml
          grep -q 'READER_PROVIDER_URL' render.yaml
          grep -q 'https://manzili-hai-reader-v3-final.onrender.com' render.yaml
          grep -q 'READER_PROVIDER_TOKEN' render.yaml
          grep -q 'READER_PROVIDER_NAME' render.yaml
          grep -q 'hai-reader-v3' render.yaml
          grep -q 'manzili-hai-reader-v3-final' render.yaml
          grep -q 'pip install -r backend/requirements-reader-v3.txt' render.yaml
          grep -q 'uvicorn app.reader_main:app' render.yaml
          grep -q '/opt/render/project/src/backend/models/floorplan/best.safetensors' render.yaml
          grep -q 'FLOORPLAN_TILED_INFERENCE' render.yaml
          grep -q 'FLOORPLAN_MAX_TILES' render.yaml
          grep -q 'manzili-hai-ocr-ar-en' render.yaml
          grep -q 'requirements-ocr-service.txt' render.yaml
          grep -q 'install_portable_tesseract.py' render.yaml
          grep -q 'uvicorn app.ocr_main:app' render.yaml
          grep -q 'OCR_PROVIDER_URL' render.yaml
          grep -q 'https://manzili-hai-ocr-ar-en.onrender.com' render.yaml
          grep -q 'OCR_PROVIDER_TOKEN' render.yaml
          grep -q 'OCR_SERVICE_TOKEN' render.yaml
          grep -q '^pytesseract==0.3.13$' backend/requirements-ocr-service.txt

      - name: Verify CPU-only compatibility dependency set
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^cryptography==45.0.7$' backend/requirements-ml-cpu.txt
          grep -q '^torch==2.14.0+cpu$' backend/requirements-ml-cpu.txt
          grep -q '^torchvision==0.29.0+cpu$' backend/requirements-ml-cpu.txt
          grep -q 'download.pytorch.org/whl/cpu' backend/requirements-ml-cpu.txt
          ! grep -q '^-r requirements.txt$' backend/requirements-ml-cpu.txt

      - name: Verify portable Docker Reader V3 image
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'pip install --no-cache-dir -r requirements.txt' backend/Dockerfile.reader
          grep -q 'FLOORPLAN_SAFETENSORS_MODEL=/opt/manzili/models/floorplan/best.safetensors' backend/Dockerfile.reader
          grep -q 'fetch_floorplan_model.py' backend/Dockerfile.reader
          grep -q 'RUN python ./scripts/fetch_floorplan_model.py' backend/Dockerfile.reader
          grep -q 'torch==2.14.0' backend/requirements.txt
          grep -q 'torchvision==0.29.0' backend/requirements.txt
          grep -q 'segmentation-models-pytorch==0.5.0' backend/requirements.txt
          grep -q 'safetensors==0.8.0' backend/requirements.txt
          grep -q '/opt/manzili/models/floorplan/best.safetensors' backend/scripts/fetch_floorplan_model.py

      - name: Verify Reader V3 and OCR contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'local_inference.*False' backend/app/cloud_public_gateway.py
          grep -q 'request_reader' backend/app/cloud_public_gateway.py
          grep -q 'request_reader' backend/app/cloud_gateway.py
          grep -q 'Reader V3 was temporarily unavailable; Modal fallback was used' backend/app/cloud_gateway.py
          grep -q 'READER_PROVIDER_URL' backend/app/reader_provider.py
          grep -q 'from .parser_v3 import parse_floorplan' backend/app/reader_main.py
          grep -q 'Manzili HAI Reader V3' backend/app/reader_main.py
          grep -q 'cubicasa-unet-resnet34-v3' backend/app/reader_main.py
          grep -q 'CubiCasa segmentation model is not loaded' backend/app/reader_main.py
          grep -q 'Manzili HAI Arabic OCR' backend/app/ocr_main.py
          grep -q '/v1/ocr' backend/app/ocr_main.py
          grep -q 'RemoteOCRReaderAdapter' backend/app/ocr_reader.py
          grep -q 'remote-tesseract-ara-eng' backend/app/ocr_reader.py
          grep -q 'app.parser_v3 import parse_floorplan' backend/scripts/run_saudi_benchmark.py
          grep -q 'cubicasa-unet-resnet34-v3' benchmarks/saudi-floorplans/quality-gate.json
          grep -q 'user-correction bundles are accepted as train only' backend/scripts/ingest_reader_learning_bundle.py
