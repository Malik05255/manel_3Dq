services:
  - type: web
    name: manzili-hai-deep-parser
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.ml
    dockerContext: ./backend
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: FLOORPLAN_SAFETENSORS_MODEL
        value: /opt/manzili/models/floorplan/best.safetensors
      - key: FLOORPLAN_DEVICE
        value: cpu
      - key: FLOORPLAN_TORCH_THREADS
        value: "2"
      - key: MANZILI_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
