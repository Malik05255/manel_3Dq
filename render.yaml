services:
  - type: web
    name: manzili-hai-deep-parser
    runtime: python
    buildCommand: pip install -r backend/requirements-gateway.txt
    startCommand: cd backend && uvicorn app.cloud_public_gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      # Reader V3 is the production reader. Modal remains fallback-only inside the gateway.
      - key: READER_PROVIDER_URL
        value: https://manzili-hai-reader-v3-final.onrender.com
      - key: READER_PROVIDER_TOKEN
        sync: false
      - key: READER_PROVIDER_NAME
        value: hai-reader-v3
      - key: MODAL_READER_URL
        sync: false
      - key: MODAL_READER_TOKEN
        sync: false
      - key: MANZILI_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AI_ENDPOINT
        value: https://openrouter.ai/api/v1/chat/completions
      - key: AI_MODEL_DEFAULT
        value: google/gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
      - key: BLENDER_WORKER_URL
        sync: false
      - key: RENDER_WORKER_TOKEN
        sync: false

  # OCR stays outside the 512 MB CubiCasa process so Tesseract cannot push Reader V3 over its memory limit.
  - type: web
    name: manzili-hai-ocr-ar-en
    runtime: python
    buildCommand: pip install -r backend/requirements-ocr-service.txt && python backend/scripts/install_portable_tesseract.py
    startCommand: cd backend && uvicorn app.ocr_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: OCR_SERVICE_TOKEN
        sync: false
      - key: TESSERACT_LANG
        value: ara+eng
      - key: TESSERACT_CONFIG
        value: "--psm 11"

  # Production Reader V3 service. Keep this name stable because the gateway targets its public URL.
  - type: web
    name: manzili-hai-reader-v3-final
    runtime: python
    buildCommand: pip install -r backend/requirements-reader-v3.txt && FLOORPLAN_SAFETENSORS_MODEL=/opt/render/project/src/backend/models/floorplan/best.safetensors python backend/scripts/fetch_floorplan_model.py
    startCommand: cd backend && uvicorn app.reader_main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: READER_SERVICE_TOKEN
        sync: false
      - key: FLOORPLAN_SAFETENSORS_MODEL
        value: /opt/render/project/src/backend/models/floorplan/best.safetensors
      - key: OCR_PROVIDER_URL
        value: https://manzili-hai-ocr-ar-en.onrender.com
      - key: OCR_PROVIDER_TOKEN
        sync: false
      - key: OCR_PROVIDER_TIMEOUT
        value: "75"
      - key: OCR_PROVIDER_MAX_DIM
        value: "2400"
      # Free Render has 512 MB. FP32 is much faster than CPU FP16; memory is reduced by
      # a 352 canvas, one CPU thread, packed tile votes and explicit allocator trimming.
      - key: FLOORPLAN_LOW_MEMORY
        value: "true"
      - key: FLOORPLAN_IMAGE_SIZE
        value: "352"
      - key: FLOORPLAN_DTYPE
        value: "float32"
      - key: FLOORPLAN_TORCH_THREADS
        value: "1"
      - key: FLOORPLAN_TILED_INFERENCE
        value: "true"
      - key: FLOORPLAN_TILE_OVERLAP
        value: "0.30"
      - key: FLOORPLAN_MAX_TILES
        value: "12"

  - type: web
    name: manzili-hai-blender-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.blender
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RENDER_WORKER_TOKEN
        sync: false
      - key: BLENDER_BIN
        value: /usr/bin/blender
