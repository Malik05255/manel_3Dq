services:
  - type: web
    name: manzili-hai-deep-parser
    runtime: python
    buildCommand: pip install -r backend/requirements-gateway.txt
    startCommand: cd backend && uvicorn app.cloud_public_gateway:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: READER_PROVIDER_URL
        sync: false
      - key: READER_PROVIDER_TOKEN
        sync: false
      - key: READER_PROVIDER_NAME
        value: hai-hybrid-reader-v2
      - key: MODAL_READER_URL
        sync: false
      - key: MODAL_READER_TOKEN
        sync: false
      - key: MANZILI_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AI_ENDPOINT
        value: https://openrouter.ai/api/v1/chat/completions
      - key: AI_MODEL_DEFAULT
        value: google/gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
      - key: BLENDER_WORKER_URL
        sync: false
      - key: RENDER_WORKER_TOKEN
        sync: false

  - type: web
    name: manzili-hai-reader-v2
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.reader
    dockerContext: .
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: READER_SERVICE_TOKEN
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: ROBOFLOW_MODEL_IDS
        sync: false
      - key: FLOORPLAN_TILED_INFERENCE
        value: "true"
      - key: FLOORPLAN_MAX_TILES
        value: "12"

  - type: web
    name: manzili-hai-blender-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.blender
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: RENDER_WORKER_TOKEN
        sync: false
      - key: BLENDER_BIN
        value: /usr/bin/blender
