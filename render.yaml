services:
  - type: web
    name: manzili-hai-deep-parser
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.ml
    dockerContext: ./backend
    healthCheckPath: /readyz
    autoDeployTrigger: commit
    envVars:
      - key: FLOORPLAN_SAFETENSORS_MODEL
        value: /opt/manzili/models/floorplan/best.safetensors
      - key: FLOORPLAN_DEVICE
        value: cpu
      - key: FLOORPLAN_TORCH_THREADS
        value: "2"
      - key: MANZILI_API_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: AI_ENDPOINT
        value: https://openrouter.ai/api/v1/chat/completions
      - key: AI_MODEL_DEFAULT
        value: google/gemini-2.5-flash
      - key: AI_API_KEY
        sync: false
